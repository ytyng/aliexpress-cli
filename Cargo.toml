[workspace]
members = ["crates/aliexpress-core", "crates/aliexpress-cli"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ytyng/aliexpress-cli"
# Not on crates.io. Also keeps cargo-about from listing these crates among the
# third-party ones (about.toml, `[private] ignore`).
publish = false

[workspace.dependencies]
aliexpress-core = { path = "crates/aliexpress-core", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
