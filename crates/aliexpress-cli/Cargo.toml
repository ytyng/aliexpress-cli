[package]
name = "aliexpress-cli"
description = "Search AliExpress from the command line: Yoridori / Choice / price filters, duplicate removal, value ranking, and an optional desktop window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "aliexpress_cli"
path = "src/lib.rs"

[[bin]]
name = "aliexpress"
path = "src/main.rs"

[features]
# The window pulls in Tauri, which needs webkit2gtk / gtk3 at build time on Linux.
# On by default so that `aliexpress --gui` works out of the box; build with
# --no-default-features for a command line only binary.
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-build"]

[dependencies]
aliexpress-core.workspace = true
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
