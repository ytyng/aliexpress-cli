<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AliExpress Search</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form class="form" id="form">
      <div class="row">
        <input id="keyword" type="search" placeholder="Search AliExpress…" autocomplete="off" autofocus />
        <button id="search" type="submit">Search</button>
      </div>
      <div class="row options">
        <label><input id="shop-only" type="checkbox" /> 100-yen Shop only</label>
        <label><input id="shop-exclude" type="checkbox" /> Not 100-yen Shop</label>
        <label><input id="choice" type="checkbox" /> Choice</label>
        <label><input id="free-shipping" type="checkbox" /> Free shipping</label>
        <label><input id="exclude-ads" type="checkbox" /> No ads</label>
        <label><input id="dedupe" type="checkbox" /> Remove similar</label>
        <label>Price <input id="min-price" type="number" min="0" step="any" placeholder="min" /> – <input id="max-price" type="number" min="0" step="any" placeholder="max" /></label>
        <label>Rating ≥ <input id="min-rating" type="number" min="0" max="5" step="0.1" placeholder="4.5" /></label>
        <label>Sort
          <select id="sort">
            <option value="best">Best match</option>
            <option value="value">Best value</option>
            <option value="price_asc">Price: low to high</option>
            <option value="price_desc">Price: high to low</option>
            <option value="orders">Most sold</option>
          </select>
        </label>
        <label>Pages <input id="pages" type="number" min="1" max="10" value="2" /></label>
        <label>Show at most <input id="limit" type="number" min="1" value="100" /></label>
      </div>
    </form>

    <main id="results" class="results"></main>

    <footer class="status" id="status">Ready.</footer>

    <script src="app.js"></script>
  </body>
</html>
