# Configuration of cargo-about, read by scripts/generate-third-party-notices.sh.
# Only crates that end up in a shipped binary are listed: build-time and
# test-only dependencies are left out.
#
# `targets` is the macOS build alone because it is the superset: it is built with
# the default features (the Tauri window included), while the Linux build is
# `--no-default-features`. The script checks that every crate of the Linux build
# is in the list, and fails if one is not.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    # webpki-roots (the Mozilla root certificates ureq trusts through rustls). A
    # permissive data licence whose only condition is to pass the text on.
    "CDLA-Permissive-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = ["aarch64-apple-darwin"]
workarounds = ["ring", "rustls"]

# The workspace's own crates (publish = false) are not third-party.
[private]
ignore = true
